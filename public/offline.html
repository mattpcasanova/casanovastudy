<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e40af" />
  <title>You're offline | Casanova Study</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc; color: #0f172a;
    }
    header {
      background: linear-gradient(135deg, #1e40af, #2563eb 55%, #06b6d4);
      color: #fff; padding: calc(env(safe-area-inset-top) + 14px) 20px 14px;
      display: flex; align-items: center; gap: 10px; font-weight: 700;
    }
    header img { width: 32px; height: 32px; border-radius: 8px; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .card {
      max-width: 420px; width: 100%; background: #fff; border: 1px solid #e2e8f0;
      border-radius: 16px; padding: 28px 24px; text-align: center;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: #475569; line-height: 1.5; margin: 0 0 20px; }
    button {
      appearance: none; border: 0; border-radius: 10px; padding: 12px 20px; min-height: 44px;
      background: #2563eb; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:active { background: #1d4ed8; }
  </style>
</head>
<body>
  <header><img src="/icons/icon-192.png" alt="" /> Casanova Study</header>
  <main>
    <div class="card">
      <h1>You're offline</h1>
      <p>This page needs an internet connection. Check your Wi-Fi or data, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </main>
  <script>window.addEventListener('online', function () { location.reload() })</script>
</body>
</html>
